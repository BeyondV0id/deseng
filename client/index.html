<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />

  <title>%PAGE_TITLE%</title>
  <meta name="description" content="%PAGE_DESCRIPTION%" />
  <meta name="application-name" content="Reference" />
  <meta name="apple-mobile-web-app-title" content="Reference" />
  <meta name="robots" content="%PAGE_ROBOTS%" />
  <meta name="theme-color" content="#fafafa" />
  <meta name="color-scheme" content="light dark" />

  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="describedby" href="/llms.txt" />

  <!-- Open Graph. X and other scrapers fall back to og:* for twitter:*, so
       there is no second copy of the title and description here. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Reference" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="%PAGE_TITLE%" />
  <meta property="og:description" content="%PAGE_DESCRIPTION%" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Reference wordmark and dithered logo." />

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary_large_image" />

  <script>
    // The theme is known before the first paint, so the page never renders in
    // the light tokens first. Without this the stored preference lands after
    // React mounts, and every surface that transitions its fill fades from
    // the light value into the dark one: a near-white pill on a dark bar.
    try {
      // Match the preference keys in src/lib/theme.ts.
      var keys = ['reference-theme-v2', 'desgnix-theme-v2', 'deseng-theme-v2', 'fieldnotes-theme-v2']
      var stored
      for (var key of keys) {
        stored = localStorage.getItem(key)
        if (stored === 'light' || stored === 'dark' || stored === 'system') break
      }
      var theme = stored === 'light' || stored === 'dark'
        ? stored
        : stored === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : 'dark'
      document.documentElement.classList.toggle('dark', theme === 'dark')
      document.documentElement.dataset.theme = theme
      document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#020202' : '#fafafa')
    } catch (error) { }
  </script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
